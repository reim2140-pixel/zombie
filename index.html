<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>좀비섬멸 전적실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style id="app-style">/* 레이아웃: 흰 상단바 + 탭, 연회색 바탕 위 흰 카드. 흔히 보는 깔끔한 웹사이트 형태. */
:root{
  --bg:#070914; --surface:rgba(18,22,40,.74); --surface2:rgba(255,255,255,.06); --surface3:rgba(255,255,255,.11); --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.2);
  --fg:#eef1fb; --muted:#aab2cc; --faint:#6f7892;
  --accent:#8da2ff; --accent-ink:#0b1027; --accent-dim:rgba(141,162,255,.16);
  --win:#4ade80; --win-dim:rgba(74,222,128,.14); --loss:#ff6b6b; --loss-dim:rgba(255,107,107,.14);
  --teamA:#67b3ff; --teamA-dim:rgba(103,179,255,.16); --teamB:#ff9a4d; --teamB-dim:rgba(255,154,77,.16);
  --gold:#ffd166; --gold-dim:rgba(255,209,102,.16);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c0:#4b5560;--grid:rgba(255,255,255,.08);--tip-bg:#eef1fb;--tip-fg:#070914;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --font-display:var(--font); --font-body:var(--font); --font-num:var(--font);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
#stars,#bg3d{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#bg3d{opacity:0;transition:opacity 1.2s ease}
#bg3d.on{opacity:1}
.bg-veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,9,20,.05),rgba(7,9,20,.3) 55%,rgba(7,9,20,.7));transition:opacity .6s}
.app,.bottombar,.sheet,.modal,.confirm,.toast,.tip{position:relative;z-index:1}
.app{z-index:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em;margin:0}
.num{font-variant-numeric:tabular-nums;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 레이아웃: PC 왼쪽 숨은 메뉴(블랙홀 펼침) · 폰 아래 탭바 ---------- */
.app{display:block;min-height:100vh}
#vortex{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .55s ease}
.side-edge{position:fixed;left:0;top:0;bottom:0;width:36px;z-index:31;cursor:pointer;display:flex;align-items:center;justify-content:flex-start}
.side-edge span{writing-mode:vertical-rl;font-size:14px;font-weight:800;letter-spacing:.25em;color:var(--accent-ink);background:var(--accent);border-radius:0 14px 14px 0;padding:18px 7px;box-shadow:0 0 22px rgba(141,162,255,.6);animation:edgeGlow 2.4s ease-in-out infinite}
.menu-btn{display:none;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:7px 14px;font-weight:800;font-size:14px;margin-right:4px;box-shadow:0 0 16px rgba(141,162,255,.45)}
.menu-btn:hover{filter:brightness(1.08)}
@media (min-width:861px){.menu-btn{display:inline-flex}}
body.bg-off #bg3d{opacity:0}
body.bg-off .home-window{min-height:0}
body.bg-off .bg-veil{background:rgba(7,9,20,.5)}
@keyframes edgeGlow{50%{box-shadow:0 0 30px rgba(141,162,255,.7)}}
body.side-open .side-edge span{opacity:0}
.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:32;background:rgba(10,13,30,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));overflow:auto;clip-path:circle(0px at 0 50%);transition:clip-path .75s cubic-bezier(.2,.8,.2,1);pointer-events:none}
body.side-open .side{clip-path:circle(150% at 0 50%);pointer-events:auto}
.side .tab,.side-brand,.side-foot{opacity:0;transform:translateX(-90px) rotate(-28deg) scale(.4);filter:blur(8px);transition:none}
body.side-open .side .tab,body.side-open .side-brand,body.side-open .side-foot{animation:unfold .7s cubic-bezier(.2,.9,.25,1.2) both}
body.side-open .side-brand{animation-delay:.05s}
body.side-open .side .tab:nth-child(1){animation-delay:.12s}body.side-open .side .tab:nth-child(2){animation-delay:.17s}body.side-open .side .tab:nth-child(3){animation-delay:.22s}body.side-open .side .tab:nth-child(4){animation-delay:.27s}body.side-open .side .tab:nth-child(5){animation-delay:.32s}body.side-open .side .tab:nth-child(6){animation-delay:.37s}body.side-open .side .tab:nth-child(7){animation-delay:.42s}body.side-open .side .tab:nth-child(9){animation-delay:.47s}body.side-open .side .tab:nth-child(10){animation-delay:.52s}
body.side-open .side-foot{animation-delay:.55s}
@keyframes unfold{from{opacity:0;transform:translateX(-90px) rotate(-28deg) scale(.4);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{font-size:26px;line-height:1}
.side-brand h1{font-size:17px;line-height:1.2}
.side-brand .sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;font-size:15px;font-weight:500;color:var(--fg)}
.menu .tab i{font-style:normal;width:22px;text-align:center;font-size:17px}
.menu .tab:hover{background:var(--surface2)}
.menu .tab[aria-selected="true"]{background:var(--accent-dim);color:var(--accent);font-weight:700}
.menu-sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.side-foot .chip{display:flex;justify-content:space-between;background:none;border:0;padding:2px 0;font-size:13px}
.side-foot .chip b{color:var(--fg)}
.content{min-width:0}
.mhead{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;align-items:center;gap:8px;background:rgba(7,9,20,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(48px,env(safe-area-inset-left,0px));font-size:16px}
.mhead .logo{font-size:20px}
.mhead-r{margin-left:auto;font-size:12px;color:var(--muted)}
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,13,30,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottombar .tab{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;color:var(--muted);border-radius:8px}
.bottombar .tab i{font-style:normal;font-size:20px;line-height:1}
.bottombar .tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.sheet{position:fixed;inset:0;z-index:45;background:rgba(5,7,15,.6);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-box{background:rgba(14,18,36,.96);width:100%;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px}
.sheet-h{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.sheet .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:11px 10px;font-size:15px;color:var(--fg)}
.sheet .tab i{font-style:normal;width:22px;text-align:center;font-size:17px}
.sheet .tab[aria-selected="true"]{background:var(--accent-dim);color:var(--accent);font-weight:700}
@media (max-width:860px){
  .side,.side-edge,#vortex{display:none}
  .mhead{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .bottombar{display:flex}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* ---------- 본문 ---------- */
main{max-width:940px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}
.view[hidden]{display:none}
.sec{margin:0 0 24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.sec-h h2{font-size:17px}
.sec-h h2 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.sec-h .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card.tight{padding:8px 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);padding:28px 14px;text-align:center;border:1px dashed var(--line2);border-radius:12px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);line-height:1.7}
.empty b{color:var(--fg)}

/* ---------- 오늘의 한마디 (말풍선) ---------- */
.hero{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;margin-bottom:22px}
@media (max-width:520px){.hero{grid-template-columns:52px 1fr}}
.bot{display:flex;flex-direction:column;align-items:center;gap:4px}
.bot-face{width:60px;height:60px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:34px;box-shadow:var(--shadow);animation:botBob 3.2s ease-in-out infinite}
@keyframes botBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (max-width:520px){.bot-face{width:48px;height:48px;font-size:28px}}
.home-window{position:relative;min-height:min(46vh,430px);display:flex;align-items:flex-end;margin-bottom:18px}
@media (max-width:860px){.home-window{min-height:min(40vh,330px)}}
.home-window .hero{margin:0;width:100%}
.bot .nm{font-size:11px;color:var(--muted);font-weight:600}
.bubble{position:relative;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;border-top-left-radius:4px;padding:14px 18px 12px;box-shadow:var(--shadow);min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.hero .eyebrow{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.hero .eyebrow i{display:none}
.quip{font-size:clamp(19px,3.2vw,25px);font-weight:700;line-height:1.45;margin:4px 0 10px;text-wrap:balance;animation:quipIn .35s ease-out both}
.quip b{color:var(--accent);font-weight:800}
@keyframes quipIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero .row{padding:0}
.hero-stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hs{display:flex;align-items:baseline;gap:5px;padding:0;border:0}
.hs .l{font-size:12px;color:var(--muted)}
.hs .v{font-size:14px;font-weight:700;line-height:1.3}
.hs .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:1px}
@media (prefers-reduced-motion:reduce){.quip{animation:none}}

/* 아바타 */
.ava{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:hsl(var(--h) 45% 30%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:15px;line-height:1;vertical-align:middle;margin-right:6px;flex:none}
.ava.lg{width:36px;height:36px;font-size:20px}
.ava.xl{width:52px;height:52px;font-size:30px;margin-right:0}
.pname{display:inline-flex;align-items:center}

/* 홈 TOP5 */
.top5{display:flex;flex-direction:column;gap:4px}
.top5 .tr{display:grid;grid-template-columns:30px 1fr 120px 70px;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line)}
@media (max-width:520px){.top5 .tr{grid-template-columns:28px 1fr 60px}.top5 .tr .bar{display:none}}
.top5 .medal{font-size:18px;text-align:center}
.top5 .rec{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.teaser-chips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{display:inline-flex;flex-direction:column;gap:2px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px;text-decoration:none;color:var(--fg)}
.tchip .l{font-size:11px;color:var(--muted);font-weight:600}
.tchip .v{font-size:14px;font-weight:700}
.tchip:hover{border-color:var(--accent)}

/* ---------- 입장: 3D 카드 → 블랙홀 ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#05060f;transition:background 1.4s ease,opacity .7s ease}
#intro[hidden]{display:none}
#intro.reveal{background:rgba(5,6,15,0)}
#intro.intro-out{opacity:0;pointer-events:none}
#intro-gl{position:absolute;inset:0;width:100%;height:100%}
.intro-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;perspective:1100px;pointer-events:none}
.intro-title{font-size:clamp(24px,5vw,48px);font-weight:900;letter-spacing:-.02em;color:#fff;margin-bottom:12px;flex:none;text-shadow:0 0 18px rgba(141,162,255,.9),0 0 50px rgba(100,120,255,.6),0 2px 0 #3b45a8,0 4px 0 #2b338a,0 6px 0 #1f2566,0 8px 14px rgba(0,0,0,.6);transform:translateZ(60px);animation:titleIn 1.2s cubic-bezier(.2,.9,.2,1) both;text-wrap:balance;text-align:center}
@keyframes titleIn{from{opacity:0;transform:translateZ(-600px) translateY(-80px) rotateX(50deg)}to{opacity:1;transform:translateZ(60px)}}
.gcard{pointer-events:auto;width:100%;max-width:560px;max-height:calc(100vh - 100px);max-height:calc(100svh - 100px);overflow:auto;overscroll-behavior:contain;background:linear-gradient(160deg,rgba(28,32,62,.92),rgba(12,14,30,.95));border:1px solid rgba(160,175,255,.45);border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(120,140,255,.25);padding:24px;transform-style:preserve-3d;opacity:0;transform:translateZ(-900px) rotateX(70deg);transition:transform .15s linear}
.gcard.in{animation:cardIn 1.3s cubic-bezier(.2,.9,.2,1) .25s both}
@keyframes cardIn{from{opacity:0;transform:translateZ(-900px) rotateX(70deg) rotateZ(-20deg)}60%{opacity:1}to{opacity:1;transform:translateZ(0) rotateX(0) rotateZ(0)}}
.gcard.sucked{animation:cardSuck 1.15s cubic-bezier(.7,0,.9,.2) both !important;pointer-events:none}
@keyframes cardSuck{0%{transform:translateZ(0) rotate(0) scale(1);filter:blur(0);opacity:1}40%{transform:rotate(180deg) scale(.7) skew(8deg,4deg);filter:blur(1px)}100%{transform:rotate(900deg) scale(.01) translateZ(-200px);filter:blur(12px);opacity:0}}
.link-notice{margin:0 0 14px;background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.45);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}
.link-notice .ln-h{font-weight:800;color:var(--gold);margin-bottom:4px}
.link-notice ul{margin:0;padding-left:18px;display:block}
.link-notice li{padding:2px 0;background:none;border:0;font-size:13px}
.link-notice .ln-f{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.link-notice .ln-f::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win);animation:edgeGlow 1.6s ease-in-out infinite;display:inline-block}
.gcard .tag{font-size:13px;font-weight:700;color:var(--loss);display:flex;align-items:center;gap:6px}
.gcard .tag i{width:8px;height:8px;border-radius:50%;background:var(--loss);display:inline-block;box-shadow:0 0 10px var(--loss)}
.gcard h2{font-size:26px;margin:6px 0 10px;line-height:1.25}
.gcard h2 b{color:var(--loss);text-shadow:0 0 14px rgba(255,107,107,.6)}
.gcard p{margin:0 0 10px;line-height:1.6}
.gcard ul{margin:12px 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.gcard li{padding:9px 12px;background:rgba(255,255,255,.05);border-left:3px solid var(--loss);border-radius:6px;font-size:14px}
.gcard li.ok{border-left-color:var(--win)}
.gcard .warn{border:1px solid var(--loss);background:var(--loss-dim);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px;margin-bottom:16px}
.gcard .btn{width:100%;font-size:16px;padding:13px}
.intro-skip{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));pointer-events:auto;color:var(--muted)}
.gate-open{overflow:hidden}
@media (prefers-reduced-motion:reduce){.intro-title,.gcard.in{animation-duration:.01s}.gcard.sucked{animation-duration:.3s !important}}

/* ---------- 연승/연패 ---------- */
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.streaks{grid-template-columns:1fr}}
.streak-box{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.streak-box h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.streak-list{display:flex;flex-direction:column;gap:6px}
.streak-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;background:var(--surface2)}
.streak-row .nm{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streak-row .cnt{font-size:20px;font-weight:700;line-height:1}
.streak-row .cnt small{font-size:12px;margin-left:2px;color:var(--muted);font-weight:500}
.hot .streak-row .cnt{color:var(--win)}.cold .streak-row .cnt{color:var(--loss)}
.streak-row .since{font-size:12px;color:var(--muted);white-space:nowrap}
.streak-row.big{background:var(--loss-dim)}
.hot .streak-row.big{background:var(--win-dim)}

/* ---------- 테이블 ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:700px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
th.sorted{color:var(--accent)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.rank-n{font-weight:600;color:var(--muted);display:inline-block;min-width:24px}
.rank-n.top{color:var(--accent)}
.pname{font-weight:600;cursor:pointer;color:var(--fg);background:none;border:0;padding:0;font-size:15px}
.pname:hover{color:var(--accent);text-decoration:underline}
.bar{display:inline-flex;align-items:center;gap:8px;min-width:130px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--surface3);flex:1;overflow:hidden;position:relative}
.bar i::after{content:"";position:absolute;inset:0;width:var(--w,0%);background:var(--win);border-radius:4px}
.bar.low i::after{background:var(--loss)}
.bar.mid i::after{background:var(--gold)}
.form{display:inline-flex;gap:3px}
.form s{display:inline-block;width:10px;height:10px;border-radius:3px;text-decoration:none}
.form s.W{background:var(--win)}.form s.L{background:var(--loss)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.win{background:var(--win-dim);color:var(--win)}.pill.loss{background:var(--loss-dim);color:var(--loss)}
.pill.zero{background:var(--surface3);color:var(--muted)}
.pill.A{background:var(--teamA-dim);color:var(--teamA)}.pill.B{background:var(--teamB-dim);color:var(--teamB)}
.pill.gold{background:var(--gold-dim);color:var(--gold)}
.money.plus{color:var(--win)}.money.minus{color:var(--loss)}

/* ---------- 경기 카드 ---------- */
.day-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.day-h h3{font-size:16px}
.day-h .meta{color:var(--muted);font-size:13px}
.match{display:grid;grid-template-columns:44px 1fr auto 1fr;gap:12px;align-items:center;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
@media (max-width:640px){.match{grid-template-columns:40px 1fr;row-gap:6px}.match .vs{display:none}.match .team.b{grid-column:2}}
.match .turn{font-size:18px;font-weight:700;color:var(--muted);line-height:1;text-align:center}
.match .turn small{display:block;font-size:11px;font-weight:500;margin-top:2px}
.match .team{min-width:0;padding-left:10px;border-left:3px solid var(--line2);border-radius:2px}
.match .team.a{border-left-color:var(--teamA)}
.match .team.b{border-left-color:var(--teamB)}
.match .team .cap{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.match .team .cap .tag{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600}
.team.a .cap .tag{background:var(--teamA-dim);color:var(--teamA)}
.team.b .cap .tag{background:var(--teamB-dim);color:var(--teamB)}
.match .team .mem{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.match .team.won .cap::after{content:"승";font-size:11px;background:var(--win);color:#fff;padding:1px 6px;border-radius:4px}
.match .team.lost .cap{color:var(--muted)}
.match .vs{text-align:center;color:var(--faint);font-size:12px;font-weight:600;min-width:60px}
.match .vs b{display:block;color:var(--fg);font-size:14px}
.match .foot{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.match .foot .sp{flex:1}
.match .foot button{font-size:12px;padding:3px 10px}

/* ---------- 버튼/입력 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--fg);text-decoration:none;transition:background .12s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px 24px;font-size:16px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.inp{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-dim)}
.inp.err{border-color:var(--loss)}
select.inp{appearance:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.frow{grid-template-columns:1fr 1fr}}
.teambox{border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.teambox.a{border-top:3px solid var(--teamA)}.teambox.b{border-top:3px solid var(--teamB)}
.teambox h3{font-size:16px;margin:0 0 10px}
.teambox.a h3{color:var(--teamA)}.teambox.b h3{color:var(--teamB)}
.teambox .mems{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.winpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.winbtn{border:2px solid var(--line2);background:var(--surface);border-radius:10px;padding:14px;font-size:18px;font-weight:700;color:var(--muted)}
.winbtn.a[aria-pressed="true"]{border-color:var(--teamA);color:var(--teamA);background:var(--teamA-dim)}
.winbtn.b[aria-pressed="true"]{border-color:var(--teamB);color:var(--teamB);background:var(--teamB-dim)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line2);background:var(--surface);padding:7px 14px;font-weight:500;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.msg{padding:10px 14px;border-radius:8px;font-size:14px;margin-top:12px}
.msg.err{background:var(--loss-dim);color:var(--loss)}
.msg.ok{background:var(--win-dim);color:var(--win)}
.msg.info{background:var(--accent-dim);color:var(--fg)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px}

/* ---------- 주사위 ---------- */
.dice-wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
@media (max-width:820px){.dice-wrap{grid-template-columns:1fr}}
.stage{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;perspective:900px;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;left:50%;top:62%;width:150px;height:30px;transform:translateX(-50%);background:rgba(0,0,0,.18);filter:blur(14px);border-radius:50%;pointer-events:none}
.die-outer{width:120px;height:120px;position:relative;z-index:1}
.die{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.17,.84,.3,1);transform:rotateX(-20deg) rotateY(25deg)}
.die-outer.bounce{animation:bounce 1.5s cubic-bezier(.2,.8,.3,1)}
@keyframes bounce{0%{transform:translateY(0)}25%{transform:translateY(-70px)}50%{transform:translateY(0)}70%{transform:translateY(-22px)}100%{transform:translateY(0)}}
.die .face{position:absolute;inset:0;background:linear-gradient(145deg,#ffffff,#e3e5ea);border-radius:16px;border:1px solid #cfd3da;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;gap:4px;box-shadow:inset 0 0 18px rgba(0,0,0,.08);backface-visibility:hidden}
.face.f1{transform:rotateY(0deg) translateZ(60px)}
.face.f6{transform:rotateY(180deg) translateZ(60px)}
.face.f2{transform:rotateY(90deg) translateZ(60px)}
.face.f5{transform:rotateY(-90deg) translateZ(60px)}
.face.f3{transform:rotateX(90deg) translateZ(60px)}
.face.f4{transform:rotateX(-90deg) translateZ(60px)}
.pip{width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#444,#111);align-self:center;justify-self:center;max-width:22px}
.pip.hide{visibility:hidden}
.face.f1 .pip.red{background:radial-gradient(circle at 35% 35%,#e8553d,#9f1d10)}
.dice-result{font-size:22px;font-weight:700;text-align:center;min-height:1.3em;z-index:1;text-wrap:balance}
.dice-result.invalid{color:var(--loss)}
.dice-result.ok{color:var(--accent)}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cand{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:8px;padding:7px 10px;border:1px solid var(--line)}
.cand .n{font-size:16px;font-weight:700;width:28px;height:28px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.cand .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cand.picked{border-color:var(--accent);background:var(--accent-dim)}
.cand.picked .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cand .x{background:none;border:0;color:var(--muted);font-size:16px;padding:2px 6px}
.cand .x:hover{color:var(--loss)}
.vs-banner{margin-top:14px;border-radius:12px;padding:16px;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.vs-banner .t{font-size:12px;color:var(--muted);font-weight:600}
.vs-banner .names{font-size:clamp(22px,4.5vw,30px);font-weight:800;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.vs-banner .names .ca{color:var(--teamA)}.vs-banner .names .cb{color:var(--teamB)}
.vs-banner .names .v{color:var(--faint);font-size:.6em}
.rolllog{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:3px;font-size:13px;max-height:180px;overflow:auto}
.rolllog li{display:flex;gap:8px;align-items:center;color:var(--muted);padding:2px 0}
.rolllog li b{font-size:15px;color:var(--fg);width:22px;text-align:center}
.rolllog li.inv{color:var(--loss)}
.rolllog li.ok{color:var(--fg)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 상세 모달 / 토스트 / 확인 ---------- */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
@media (min-width:640px){.modal{align-items:center;padding:24px}}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:min(88vh,920px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal .box{border-radius:16px;padding-bottom:20px}}
.modal .box h2{font-size:24px;margin:0 0 4px}
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media (max-width:520px){.stat-tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface2);border-radius:10px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;line-height:1.2}
.tile .v.win{color:var(--win)}.tile .v.loss{color:var(--loss)}.tile .v.gold{color:var(--gold)}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px}
.kv > span{padding:5px 0;border-bottom:1px solid var(--line)}
.kv > span:nth-child(3n+2){text-align:right;font-weight:600}
.kv > span:nth-child(3n+3){text-align:right;color:var(--muted);min-width:52px}
.kv-h{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
/* ---------- 대기실 카드 ---------- */
.lobby{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,15,.35);opacity:0;transition:opacity .35s}
.lobby.in{opacity:1}
.lobby[hidden]{display:none}
.lobby-card{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:rgba(14,18,36,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:18px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(141,162,255,.15);transform:translateY(16px) scale(.97);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.lobby.in .lobby-card{transform:none}
.lobby-card.swap{transform:translateY(-10px) scale(.98);opacity:0;transition:transform .2s,opacity .2s}
.plea{text-align:center}
.plea-ico{font-size:44px;line-height:1;margin-bottom:6px;animation:botBob 2.2s ease-in-out infinite}
.plea h2{font-size:24px;margin:0 0 8px}
.plea h2 b{color:var(--win)}
.plea p{margin:0 auto 12px;max-width:40ch;line-height:1.65}
.plea-list{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;text-align:left}
.plea-list li{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.plea .btn.big{width:100%}
.lobby-card .tag{font-size:12px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:6px}
.lobby-card .tag i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;box-shadow:0 0 10px var(--gold)}
.lobby-card h2{font-size:24px;margin:6px 0 8px;line-height:1.25}
.lobby-card h2 b{color:var(--accent)}
.lobby-card p{margin:0 0 10px;line-height:1.6;color:var(--fg)}
.lobby-list{margin:8px 0 12px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:520px){.lobby-list{grid-template-columns:1fr}}
.lobby-list li{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
.lobby-list li small{display:block;color:var(--muted);font-size:11.5px}
.lobby-now{font-size:13px;color:var(--muted);background:rgba(255,209,102,.08);border:1px dashed rgba(255,209,102,.4);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.lobby-now b{color:var(--fg)}
.lobby-lab{display:block;font-size:14px;font-weight:700;margin:6px 0 6px}
.lobby-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.lobby-card .quick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.play-btn{border-color:rgba(74,222,128,.5);color:#b7f5a8}
/* ---------- 조작 모드 HUD ---------- */
body.play-mode .app,body.play-mode .bottombar,body.play-mode .side-edge,body.play-mode #vortex,body.play-mode #stars{display:none}
body.play-mode .bg-veil{opacity:0}
body.play-mode{overflow:hidden}
#hud{position:fixed;inset:0;z-index:50;user-select:none;-webkit-user-select:none;touch-action:none;font-size:14px}
#hud[hidden]{display:none}
.hud-top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud-me,.hud-online{background:rgba(8,10,20,.75);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.hud-online{font-weight:500;color:var(--muted)}
.hud-sp{flex:1}
.hud-top .btn{background:rgba(8,10,20,.8)}
.hud-cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none}
.hud-cross::before,.hud-cross::after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 4px #000}
.hud-cross::before{left:6px;top:0;width:2px;height:14px}.hud-cross::after{top:6px;left:0;height:2px;width:14px}
.hud-cross[hidden]{display:none}
.hud-center{position:absolute;left:16px;right:16px;top:18%;text-align:center;font-size:clamp(22px,4vw,40px);font-weight:900;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 30px rgba(0,0,0,.7);pointer-events:none;line-height:1.25}
.hud-center.ok{color:#fff}.hud-center.invalid{color:#ff8a8a}.hud-center.final{color:var(--gold);animation:finalPop .6s cubic-bezier(.2,.9,.3,1.3) both}
.hud-center[hidden]{display:none}
.hud-hint{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:rgba(8,10,20,.8);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-hint:empty{display:none}
.hud-hint.flash{border-color:var(--gold);color:var(--gold)}
.hud-keys{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(255,255,255,.7);text-shadow:0 1px 6px #000;max-width:46%}
.hud-emotes{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.hud-emotes button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(8,10,20,.78);font-size:22px;line-height:1}
.hud-emotes button:hover{border-color:var(--accent)}
.hud-lock{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:rgba(5,7,15,.35);cursor:pointer;text-align:center;line-height:1.6;font-size:16px;font-weight:600}
.hud-top,.hud-emotes,.hud-mbtns,.hud-hint,.hud-center{z-index:2}
.hud-lock small{font-weight:400;color:var(--muted)}
.hud-lock[hidden]{display:none}
.joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;pointer-events:none}
.joy.on{display:block}
.joy-knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
.hud-mbtns{position:absolute;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:8px}
.hud-mbtns button{width:58px;height:58px;border-radius:50%;border:1px solid var(--line2);background:rgba(8,10,20,.8);font-size:20px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.hud-mbtns button small{font-size:9px;color:var(--muted)}
.hud-mbtns button.on{border-color:var(--win);color:var(--win)}
body.touch-play .hud-mbtns{display:flex}
body.touch-play .hud-keys{display:none}
body.touch-play .hud-emotes{right:auto;left:12px}
body.touch-play .hud-emotes button{width:38px;height:38px;font-size:18px}
.tab.locked{opacity:.55}
.tab.locked::after{content:"🔒 관리자만";margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.mood{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translate(-50%,-24px);opacity:0;z-index:58;max-width:min(560px,calc(100% - 32px));display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:12px;background:rgba(14,18,36,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:14px;line-height:1.45;transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .35s}
.mood.in{transform:translate(-50%,0);opacity:1}
.mood[hidden]{display:none}
.mood.warn{border-color:rgba(255,107,107,.6);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 26px rgba(255,107,107,.28)}
.mood.notice{border-color:rgba(255,209,102,.55)}
.mood.fun{border-color:rgba(74,222,128,.5)}
.mood-x{background:none;border:0;color:var(--muted);font-size:14px;padding:2px 6px;flex:none}
.mood-line{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin:0 0 14px;padding:9px 12px;border-radius:10px;background:rgba(141,162,255,.08);border:1px dashed var(--line2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mood-line b{color:var(--fg)}
.mood-ico{font-size:16px;line-height:1.3;flex:none}
.streak-note{font-size:12.5px;color:var(--muted);padding:3px 12px 7px}
.streak-note b{color:var(--fg)}
.streak-box h3 small{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto;background:var(--surface2);padding:2px 8px;border-radius:999px}
.confirm{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:55;display:flex;align-items:center;justify-content:center;padding:16px}
.confirm[hidden]{display:none}
.confirm .box{background:var(--surface);border-radius:14px;padding:20px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.confirm .box p{margin:0 0 16px}
.daily-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.dp{display:flex;justify-content:space-between;align-items:center;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.dp .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dp .rec{font-weight:600;white-space:nowrap}
.dp.allw{background:var(--win-dim);border-color:transparent}.dp.alll{background:var(--loss-dim);border-color:transparent}
.map-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.map-tile{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.map-tile h4{font-size:15px;margin:0 0 6px}
.map-tile .breakdown{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.roster-list{display:flex;gap:6px;flex-wrap:wrap}
.roster-list .chip{gap:8px;color:var(--fg)}
.roster-list .chip button{background:none;border:0;color:var(--muted);padding:0;font-size:14px}
.roster-list .chip button:hover{color:var(--loss)}
textarea.inp{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.readonly-tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
@media (prefers-reduced-motion:reduce){.die{transition-duration:.3s}.die-outer.bounce{animation:none}}

/* ---------- 차트 ---------- */
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible;max-width:760px;margin:0 auto}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart text.val{fill:var(--fg);font-size:12px;font-weight:600}
.chart text.lab{fill:var(--fg);font-size:12px;font-weight:500}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .axis line{stroke:var(--line2);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .mark, .chart .mark:hover{filter:brightness(1.1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:70;background:var(--tip-bg);color:var(--tip-fg);padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-line;line-height:1.4}
.tip[hidden]{display:none}
.spark{width:72px;height:22px;display:block}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chart-h h4{font-size:14px}
.chart-h span{font-size:12px;color:var(--muted)}
.pquip{background:var(--accent-dim);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px;margin:4px 0 10px;line-height:1.5}
.modal .chart{margin:8px 0 4px}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.hof-t{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.hof-t .l{font-size:12px;color:var(--muted)}
.hof-t .v{font-size:20px;font-weight:700;line-height:1.3}
.hof-t .n{font-weight:600;color:var(--accent)}
.dmark{width:48px;height:48px;border-radius:12px;background:var(--accent-dim);display:grid;place-items:center;font-weight:800;color:var(--accent);flex:none}

/* ---------- 다독임 방 ---------- */
.manifesto{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.manifesto .eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.manifesto h2{font-size:22px;margin:4px 0 8px}
.manifesto p{margin:0 0 10px;max-width:62ch;line-height:1.65}
.manifesto ul{margin:0;padding-left:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px}
@media (max-width:640px){.manifesto ul{grid-template-columns:1fr}}
.chat-box{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.chat-list{height:min(52vh,460px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.cm{max-width:80%;align-self:flex-start}
.cm.mine{align-self:flex-end}
.cm-h{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:3px}
.cm.mine .cm-h{justify-content:flex-end}
.cm-h b{color:var(--fg)}
.cm-h .x{background:none;border:0;color:var(--faint);padding:0 2px;font-size:12px}
.cm-h .x:hover{color:var(--loss)}
.cm-t{background:var(--surface2);border-radius:12px 12px 12px 4px;padding:8px 12px;line-height:1.5;overflow-wrap:anywhere}
.cm.mine .cm-t{background:var(--accent-dim);border-radius:12px 12px 4px 12px}
.chat-form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.chat-form[hidden]{display:none}
.chat-form .inp{flex:1}

/* ---------- 클릭 배치 입력 ---------- */
.pool{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pname-chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pname-chip:hover{border-color:var(--accent);color:var(--accent)}
.pname-chip i{font-style:normal;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--surface3);color:var(--muted);font-weight:700}
.pname-chip.inA{background:var(--teamA);border-color:var(--teamA);color:#fff}
.pname-chip.inB{background:var(--teamB);border-color:var(--teamB);color:#fff}
.pname-chip.inA i,.pname-chip.inB i{background:rgba(255,255,255,.25);color:#fff}
.teambox.active{box-shadow:0 0 0 3px var(--accent-dim),var(--shadow)}
.teambox h3 small{font-size:13px;color:var(--muted);margin-left:6px;font-weight:500}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px dashed var(--line2);border-radius:8px;padding:7px 10px;min-height:38px}
.slot.filled{border-style:solid;background:var(--surface)}
.slot .role{font-size:11px;font-weight:600;color:var(--muted);width:32px}
.slot.filled .role{color:var(--fg)}
.slot .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .mini{background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:2px 6px;font-size:13px}
.slot .mini:hover{border-color:var(--line2);color:var(--fg)}

/* ---------- 접기/펼치기 ---------- */
details.day{margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);overflow:hidden}
details.day summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;user-select:none}
details.day summary::-webkit-details-marker{display:none}
details.day summary:hover{background:var(--surface2)}
details.day[open] summary{border-bottom:1px solid var(--line)}
details.day summary h3{font-size:16px}
details.day summary .meta{color:var(--muted);font-size:13px;flex:1;min-width:0}
details.day summary .chev{color:var(--muted);transition:transform .2s}
details.day[open] summary .chev{transform:rotate(180deg)}
.day-body{padding:12px 12px 4px;background:var(--bg)}

/* ---------- 리더보드 ---------- */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:34px 36px 1fr auto;gap:10px;align-items:center;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.lb-row.top{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.lb-rank{font-size:18px;font-weight:700;text-align:center;color:var(--muted)}
.lb-main{min-width:0}
.lb-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;font-weight:700}
.lb-name .pname{font-size:16px}
.lb-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.lb-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:96px}
.lb-pct{font-size:18px;font-weight:800;line-height:1}
.lb-bar{width:96px;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
.lb-bar i{display:block;height:100%;width:var(--w,0%);background:var(--c,var(--win));border-radius:3px}
@media (max-width:520px){.lb-row{grid-template-columns:28px 32px 1fr auto;gap:8px;padding:10px}.lb-right{min-width:70px}.lb-bar{width:70px}.lb-name{font-size:15px}}

/* ---------- 3D 주사위 화면 ---------- */
body.dice-mode main{max-width:none;padding:0}
body.dice-mode .bg-veil{opacity:.25}
.dstage{position:relative;height:calc(100svh - 46px);min-height:520px;overflow:hidden}
.dtop{position:absolute;left:28px;top:12px;right:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:3}
.dtop h2{font-size:18px;text-shadow:0 2px 10px #000,0 0 18px rgba(0,0,0,.8);margin-right:auto}
.dtop .seg button:not([aria-pressed="true"]){background:rgba(10,13,30,.7);backdrop-filter:blur(8px)}
.dstage .dice-result{position:absolute;left:16px;right:16px;top:64px;font-size:clamp(22px,4vw,40px);font-weight:900;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.95),0 0 30px rgba(0,0,0,.7);pointer-events:none;z-index:2;line-height:1.25}
.dstage .dice-result.ok{color:#fff}
.dstage .dice-result.invalid{color:#ff8a8a}
.dstage .dice-result.ok.final{color:var(--gold);font-size:clamp(26px,5vw,52px);animation:finalPop .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes finalPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.dpanel{position:absolute;right:16px;top:60px;bottom:92px;width:min(340px,calc(100% - 32px));overflow:auto;z-index:3;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;display:flex;flex-direction:column;gap:10px}
.dpanel.closed{transform:translateX(112%);opacity:0;pointer-events:none}
.dpanel .card{background:rgba(12,15,32,.82)}
.dice-ctl{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px;z-index:3}
.dice-ctl .btn{background:rgba(10,13,30,.75);backdrop-filter:blur(8px)}
.dice-ctl .btn.primary{background:var(--accent)}
.dice-ctl .btn.big{box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(141,162,255,.45);font-size:17px;padding:12px 22px}
.dice-hint{position:absolute;left:28px;bottom:78px;font-size:12px;color:rgba(255,255,255,.8);text-shadow:0 1px 6px #000;pointer-events:none;z-index:2}
.dstage .rolllog{position:absolute;left:28px;bottom:98px;max-width:320px;max-height:110px;margin:0;font-size:12px;z-index:2;overflow:hidden;mask-image:linear-gradient(180deg,#000 60%,transparent)}
.dstage .rolllog li{text-shadow:0 1px 6px #000}
.dstage .rolllog li b{text-shadow:0 1px 6px #000}
.dbelow{max-width:940px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(28px,env(safe-area-inset-left,0px))}
@media (max-width:860px){
  .dstage{height:calc(100svh - 46px - 64px - env(safe-area-inset-bottom,0px));min-height:460px}
  .dtop{left:16px}
  .dpanel{top:auto;bottom:86px;left:16px;right:16px;width:auto;max-height:58%}
  .dpanel.closed{transform:translateY(115%)}
  .dstage .dice-result{top:58px;font-size:clamp(20px,6vw,30px)}
  .dice-hint,.dstage .rolllog{left:16px}
  .dstage .rolllog{bottom:86px;max-height:70px}
  .dbelow{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

@media (max-height:720px){.intro-title{font-size:clamp(20px,4vw,30px);margin-bottom:8px}.gcard{padding:16px 18px;max-height:calc(100svh - 70px)}.gcard h2{font-size:21px;margin:4px 0 6px}.gcard p{font-size:13.5px;margin:0 0 6px}.gcard ul{margin:8px 0 10px;gap:4px}.gcard li{padding:6px 10px;font-size:13px}.link-notice{padding:8px 10px;font-size:12.5px;margin-bottom:10px}.link-notice li{font-size:12.5px}}
</style>

function buildQuips(S) {
  var q = [], set = DB.settings, P = S.players;
  function add(key, v, weight) { var t = fill(pick(Q[key]), v); q.push({ t: t, w: weight || 1 }); }
  function addAll(key, v) { Q[key].forEach(function (tpl) { q.push({ t: fill(tpl, v), w: 1 }); }); }
  Q.general.forEach(function (t) { q.push({ t: t, w: 0.35 }); });
  if (set.spicy) QS.general.forEach(function (t) { q.push({ t: t, w: 0.5 }); });
  function addS(key, v, weight) { if (!set.spicy) return; q.push({ t: fill(pick(QS[key]), v), w: weight || 1.3 }); }
  function addAllS(key, v) { if (!set.spicy) return; QS[key].forEach(function (tpl) { q.push({ t: fill(tpl, v), w: 1.2 }); }); }
  if (!S.order.length) return q;
  P.forEach(function (p) {
    var v = { n: esc(p.name), s: Math.abs(p.streak), w: p.wins, l: p.losses, l4: p.losses * 4, r: p.rate, g: p.games, d: p.daysPlayed, cw: p.capWins, cl: p.capGames - p.capWins, cr: p.capGames ? Math.round(p.capWins / p.capGames * 100) : 0, m: (p.money > 0 ? '+' : '') + fmtMoney(p.money), last: fmtDate(p.lastDate) };
    if (p.streak >= 3) addAll('hot', v);
    if (set.showLoseStreak && p.streak <= -3) addAll('cold', v);
    if (p.streak >= 3) addAllS('hot', v); if (set.showLoseStreak && p.streak <= -3) addAllS('cold', v); if (p.games >= 5 && p.rate <= 35) addAllS('low', v); if (p.games >= 5 && p.rate >= 65) addAllS('high', v); if (p.capGames >= 2 && p.money < 0) addS('capMinus', v, 2); if (p.capGames >= 2 && p.money > 0) addS('capPlus', v, 2);
    if (p.games >= 5 && p.rate <= 35) addAll('low', v);
    else if (p.games >= 5 && p.rate >= 65) addAll('high', v);
    else if (p.games >= 4) add('mid', v);
    if (p.capGames >= 2 && p.money > 0) add('capPlus', v, 2);
    if (p.capGames >= 2 && p.money < 0) add('capMinus', v, 2);
    if (p.capGames >= 3) add('capRec', v);
    if (p.luckyCap) add('lucky', { n: v.n, c: esc(p.luckyCap.n), w: p.luckyCap.w, l: p.luckyCap.g - p.luckyCap.w }, 2);
    if (p.unluckyCap) add('unlucky', { n: v.n, c: esc(p.unluckyCap.n), w: p.unluckyCap.w, l: p.unluckyCap.g - p.unluckyCap.w });
    if (p.nemesis) add('nemesis', { n: v.n, o: esc(p.nemesis.n), w: p.nemesis.w, l: p.nemesis.g - p.nemesis.w }, 2);
    if (p.prey) add('prey', { n: v.n, o: esc(p.prey.n), w: p.prey.w, l: p.prey.g - p.prey.w });
    if (p.clutch.g >= 3 && p.clutchRate >= 65) add('clutch', { n: v.n, w: p.clutch.w, l: p.clutch.g - p.clutch.w }, 2);
    if (p.clutch.g >= 3 && p.clutchRate <= 35) add('antiClutch', { n: v.n, w: p.clutch.w, l: p.clutch.g - p.clutch.w });
    var t1 = p.turns[1], t3 = p.turns[3];
    if (p.lateDelta != null && p.lateDelta >= 25) add('late', { n: v.n, r1: Math.round(t1.w / t1.g * 100), r3: Math.round(t3.w / t3.g * 100) });
    if (p.lateDelta != null && p.lateDelta <= -25) add('early', { n: v.n, r1: Math.round(t1.w / t1.g * 100), r3: Math.round(t3.w / t3.g * 100) });
    if (p.games === 1 && p.lastDate === S.lastDate) add('rookie', { n: v.n, res: p.wins ? '승리' : '패배' });
    if (S.days.length >= 4 && p.games >= 3 && p.lastDate && S.days.slice(0, 3).every(function (d) { return !d.players[p.name]; })) add('missing', v);
  });
  S.escapes.filter(function (e) { return e.date === S.lastDate; }).forEach(function (e) { addAll('escape', { n: esc(e.name), b: e.broke }); });
  var most = S.records.mostGames; if (most && most.games >= 8) add('most', { n: esc(most.name), g: most.games, d: most.daysPlayed }, 2);
  var pairs = S.pairs.filter(function (p) { return p.g >= 3; }).sort(function (a, b) { return (b.w / b.g) - (a.w / a.g) || b.g - a.g; });
  pairs.slice(0, 3).forEach(function (pr) { if (pr.w / pr.g >= 0.7) { var ab = pr.key.split(' & '); add('pairBest', { a: esc(ab[0]), b: esc(ab[1]), w: pr.w, l: pr.g - pr.w }, 2); } });
  pairs.slice(-2).forEach(function (pr) { if (pr.w / pr.g <= 0.3) { var ab = pr.key.split(' & '); add('pairWorst', { a: esc(ab[0]), b: esc(ab[1]), w: pr.w, l: pr.g - pr.w }); } });
  var last = S.days[0];
  (last.mvp || []).forEach(function (p) { add('mvp', { n: esc(p.name), date: fmtDate(last.date), w: p.w, l: p.g - p.w }, 3); });
  Object.keys(last.players).map(function (k) { return last.players[k]; }).filter(function (p) { return p.g >= 3 && p.w === 0; }).forEach(function (p) { if (set.showLoseStreak) add('dayWorst', { n: esc(p.name), date: fmtDate(last.date), l: p.g }); });
  S.rivals.slice(0, 2).forEach(function (o) { add('rival', { a: esc(o.a), b: esc(o.b), g: o.g, wa: o.wa, wb: o.g - o.wa }); });
  S.capH2H.slice(0, 2).forEach(function (o) { add('capH2H', { a: esc(o.a), b: esc(o.b), g: o.g + 1, wa: o.wa, wb: o.g - o.wa }); });
  if (S.totalBet >= 100000) q.push({ t: '지금까지 오간 돈 <b>' + fmtMoney(S.totalBet) + '</b>. 치킨 ' + Math.floor(S.totalBet / 20000) + '마리 값입니다 🍗', w: 1 });
  var h = new Date().getHours();
  if (h >= 0 && h < 5) q.push({ t: '새벽 ' + h + '시… 내일 출근·등교는 괜찮으세요? <b>마지막 한 판</b>은 거짓말입니다', w: 1 });
  return q;
}
